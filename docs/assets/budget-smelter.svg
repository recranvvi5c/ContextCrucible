<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Budget smelter: animated bars showing how a token budget is allocated across files by relevance">
  <title>budget smelter: token allocation</title>
  <desc>Animated horizontal bars fill to show how a fixed token budget is poured into the highest-relevance files first, with lower-relevance files receiving less or nothing once the budget line is reached.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5722"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d5524"/>
      <stop offset="1" stop-color="#e0894a"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33405b"/>
      <stop offset="1" stop-color="#556699"/>
    </linearGradient>
  </defs>

  <rect width="720" height="300" fill="url(#bg2)"/>
  <text x="30" y="40" font-family="Consolas,Menlo,monospace" font-size="20" fill="#ffcf6b">budget smelter</text>
  <text x="30" y="60" font-family="Consolas,Menlo,monospace" font-size="11" fill="#8a93ad">pouring 8000 tokens · highest grade first</text>

  <!-- budget line -->
  <line x1="560" y1="80" x2="560" y2="270" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="6 4">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <text x="566" y="94" font-family="Consolas,Menlo,monospace" font-size="10" fill="#ff8a80">budget</text>

  <!-- rows -->
  <g font-family="Consolas,Menlo,monospace" font-size="11" fill="#cfd6ea">
    <!-- row 1: budget_solver.rs, grade 83 -->
    <text x="30" y="112">budget_solver.rs</text>
    <rect x="180" y="102" width="0" height="16" rx="3" fill="url(#hot)">
