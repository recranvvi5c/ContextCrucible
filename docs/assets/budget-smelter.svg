<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Budget smelter: animated bars showing how a token budget is allocated across files by relevance">
  <title>budget smelter: token allocation</title>
  <desc>Animated horizontal bars fill to show how a fixed token budget is poured into the highest-relevance files first, with lower-relevance files receiving less or nothing once the budget line is reached.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5722"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d5524"/>
      <stop offset="1" stop-color="#e0894a"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33405b"/>
      <stop offset="1" stop-color="#556699"/>
    </linearGradient>
  </defs>

  <rect width="720" height="300" fill="url(#bg2)"/>
  <text x="30" y="40" font-family="Consolas,Menlo,monospace" font-size="20" fill="#ffcf6b">budget smelter</text>
  <text x="30" y="60" font-family="Consolas,Menlo,monospace" font-size="11" fill="#8a93ad">pouring 8000 tokens · highest grade first</text>

  <!-- budget line -->
  <line x1="560" y1="80" x2="560" y2="270" stroke="#ff5252" stroke-width="1.5" stroke-dasharray="6 4">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </line>
  <text x="566" y="94" font-family="Consolas,Menlo,monospace" font-size="10" fill="#ff8a80">budget</text>

  <!-- rows -->
  <g font-family="Consolas,Menlo,monospace" font-size="11" fill="#cfd6ea">
    <!-- row 1: budget_solver.rs, grade 83 -->
    <text x="30" y="112">budget_solver.rs</text>
    <rect x="180" y="102" width="0" height="16" rx="3" fill="url(#hot)">
      <animate attributeName="width" values="0;360;360" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="114" fill="#ffcf6b">grade 83</text>

    <!-- row 2: README.md, grade 30 -->
    <text x="30" y="148">README.md</text>
    <rect x="180" y="138" width="0" height="16" rx="3" fill="url(#warm)">
      <animate attributeName="width" values="0;0;210;210" keyTimes="0;0.4;0.65;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="150" fill="#e0894a">grade 30</text>

    <!-- row 3: main.py, grade 12 -->
    <text x="30" y="184">main.py</text>
    <rect x="180" y="174" width="0" height="16" rx="3" fill="url(#cool)">
      <animate attributeName="width" values="0;0;0;150;150" keyTimes="0;0.4;0.65;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="186" fill="#8fa0cc">grade 12</text>

    <!-- row 4: strings.rs, over budget (blocked) -->
    <text x="30" y="220" fill="#6b7690">strings.rs</text>
    <rect x="180" y="210" width="0" height="16" rx="3" fill="#3a4152">
      <animate attributeName="width" values="0;0;0;0;40" keyTimes="0;0.4;0.65;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="222" fill="#ff8a80">over budget ✕</text>

    <!-- row 5: secrets.yaml, quarantined -->
    <text x="30" y="256" fill="#6b7690">secrets.yaml</text>
    <rect x="180" y="246" width="20" height="16" rx="3" fill="none" stroke="#ff5252" stroke-dasharray="4 3"/>
    <text x="206" y="258" fill="#ff8a80" font-size="10">quarantined (secret) ✕</text>
  </g>

  <!-- rising spark to indicate active pour -->
  <circle r="2.5" fill="#ffd54f">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/>
    <animateMotion path="M540 110 q10 -20 -5 -35" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
