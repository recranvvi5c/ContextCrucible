<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="contextcrucible: molten tokens pouring from a crucible into a budgeted mold">
  <title>contextcrucible: the token foundry</title>
  <desc>An animated industrial crucible tips molten "tokens" into a mold sized to a fixed budget; overflow sparks are deflected away, representing files rejected by the budget solver.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#161d33"/>
    </linearGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6478"/>
      <stop offset="1" stop-color="#2c3242"/>
    </linearGradient>
  </defs>

  <rect width="800" height="300" fill="url(#sky)"/>

  <!-- ambient furnace glow -->
  <circle cx="250" cy="120" r="150" fill="url(#glow)">
    <animate attributeName="r" values="140;165;140" dur="3.5s" repeatCount="indefinite"/>
