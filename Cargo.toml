[package]
name = "contextcrucible"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "Budget-aware context compiler for coding agents: scans a repo, scores relevance, excludes secrets, and smelts a token-bounded context pack."
license = "MIT"
readme = "README.md"
repository = "https://example.invalid/contextcrucible"
keywords = ["context", "llm", "token-budget", "coding-agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "crucible"
path = "src/main.rs"

[lib]
name = "contextcrucible"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]

[dependencies]
